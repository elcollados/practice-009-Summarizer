<!DOCTYPE html> 
<html>
<head>
    <title>AI Text Summarizer</title>
    <style>
        body {
            background-color: #0b1d3a;
            color: #e6eefc;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            padding: 40px 16px;
        }

        .card {
            background-color: #12294d;
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 600px;
        }

        h1 {
            margin-top: 0;
            text-align: center;
        }

        textarea {
            width: 100%;
            box-sizing: border-box;
            background-color: #0b1d3a;
            color: #e6eefc;
            border: 1px solid #2a4a7f;
            border-radius: 8px;
            padding: 12px;
            font-size: 16px;
            resize: vertical;
        }

        button {
            background-color: #3b82f6;
            color: whitesmoke;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 16px;
            margin-top: 12px;
            cursor: pointer;
        }

        button:hover {
            background-color: #2563eb;
        }

        .result {
            background-color: #0b1d3a;
            border-left: 4px solid #3b82f6;
            border-radius: 8px;
            padding: 16px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>AI Text Summarizer</h1>
        <form method="POST">
            <textarea name="user_text" rows="10" cols="60"></textarea>
            <br>
            <button type="submit">Summarize</button>
        </form>
        {% if result %}
        <div class="result">{{ result }}</div>
        {% endif %}
    </div>
</body>
</html>
